# Serves KRAKEN's built app (kraken/app/Dockerfile), and forwards its engine.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Browsers can't resolve Docker service names, so an app calls an engine
  # through its own origin, /engines/<engine-name>/..., and nginx forwards it to
  # http://<engine-name>:3000/... on the compose network. Websockets pass through.
  location ~ ^/engines/(?<engine>engine-[a-z0-9-]+)/(?<rest>.*)$ {
    resolver 127.0.0.11 valid=10s; # Docker's embedded DNS
    proxy_pass http://$engine:3000/$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Engines take data (Parquet uploads) and can run for a while.
    client_max_body_size 256m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # DuckDB's extensions (davy-jones-locker-extensions puts them in the app's
  # public/duckdb-extensions/, with a gzipped copy of each). Their paths name
  # the DuckDB version, so they never change. A missing one is a 404, not the
  # app's page, so DuckDB says it's missing rather than unsigned.
  location /duckdb-extensions/ {
    gzip_static on;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
