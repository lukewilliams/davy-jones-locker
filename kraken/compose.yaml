# KRAKEN, the framework's example app: its app, engine and Python sandbox,
# built from this repo's own SEAMONSTER and DAVY JONES' LOCKER.
#
#   docker compose -f kraken/compose.yaml up -d --build
#
# The app is on http://localhost:8130 (this machine only: APP_BIND), the engine on 127.0.0.1:9130 (for
# `npm run dev`, whose Vite, on 5130, proxies to it). Settings: kraken/.env (compose's IS_LOCAL),
# kraken/engine/.env and kraken/engine/runner.env (copy each .env.example).
#
# Networks:
#   default         the app network: app-kraken's nginx reaches engine-kraken here
#   kraken-sandbox  engine-kraken and the runner only, with no way out (internal)
#   shared          Postgres (and later n8n): engine-shared creates it
#                   (davy-jones-locker/engine-shared), or bring your own
#                   (docker network create shared). Another name: SHARED_NETWORK

name: kraken

services:
  # The framework's engine image, which engine-kraken is built on: built,
  # never run (scale 0).
  davy-jones-locker-engine:
    build: ../davy-jones-locker/engine
    image: davy-jones-locker-engine
    scale: 0

  app-kraken:
    build:
      context: ..
      dockerfile: kraken/app/Dockerfile
    ports:
      # This machine only, unless kraken/.env's APP_BIND says otherwise: with
      # IS_LOCAL=true the engine behind it signs no one in.
      - "${APP_BIND:-127.0.0.1}:8130:80"
    restart: unless-stopped

  engine-kraken:
    build:
      context: engine
      additional_contexts:
        davy-jones-locker-engine: service:davy-jones-locker-engine
    env_file:
      - path: engine/.env
        required: false
    environment:
      RUNNER_URL: http://engine-kraken-runner:3000
      PUBLIC_HOST: engine-kraken
      IS_LOCAL: ${IS_LOCAL:-false}   # from kraken/.env: local development only
    expose:
      - "3000"          # in-network: http://engine-kraken:3000 (n8n calls this)
    ports:
      - "127.0.0.1:9130:3000"   # on this machine only, for `npm run dev` (Vite proxies to it)
    networks:
      - default
      - kraken-sandbox
      - shared
    depends_on:
      - engine-kraken-runner
    restart: unless-stopped

  # Runs PythonScript code. It holds no credentials and can reach nothing but
  # engine-kraken; the container is read-only, unprivileged and capability-free,
  # with scratch space in memory. One run at a time per container: add
  # replicas for more.
  engine-kraken-runner:
    build:
      context: ../davy-jones-locker/engine
      dockerfile: runner/Dockerfile
    # Its own settings file, not engine/.env: nothing with credentials may
    # reach it (a script could read the server process's environment).
    env_file:
      - path: engine/runner.env
        required: false
    environment:
      RUN_SCRATCH: /tmp
      RUN_SWEEP: "1"    # after each run, kill every process it left, even outside its group
    expose:
      - "3000"
    networks:
      - kraken-sandbox
    # An init as PID 1 reaps what scripts leave behind: otherwise their exited
    # processes pile up and use up pids_limit for every later run.
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped

networks:
  kraken-sandbox:
    internal: true
  shared:
    external: true
    name: ${SHARED_NETWORK:-shared}
