# DAVY JONES' LOCKER's engine and its Python sandbox, as an app runs them.
# Copy this into your app and rename the services for it (engine-<app>, say):
# browsers reach the engine through the app's own origin at
# /engines/<service>/, so the name is part of the app's URL.
#
#   docker compose -f davy-jones-locker/compose.yaml up -d --build
#
# Settings: engine/.env for the engine (copy engine/.env.example), and
# engine/runner.env for the runner (copy engine/runner.env.example).
#
# This builds the images from engine/. They're published too, for each
# release (ghcr.io/lukewilliams/davy-jones-locker-engine, -runner and
# -node-worker, tagged with the version): replace a `build:` with
# `image: ghcr.io/lukewilliams/davy-jones-locker-runner:0.2.0`, say, and
# build the app's own engine FROM the engine's.
#
# The node worker runs the app's own node kinds (engine/davy_jones_locker/nodes.py):
# start it with --profile nodes once the app has some. An app builds its own
# worker image on the framework's (engine/nodeworker/Dockerfile), adding its
# nodes.py and handlers.
#
# Networks:
#   default  the app network: the app reaches the engine here
#   sandbox  the engine and the runner only, with no way out (internal)
#   nodes    the engine and the node worker only, with no way out (internal)
#   shared   Postgres, from engine-shared (below) or your own
#
# The engine refuses every request from the runner and the node worker (it
# looks their addresses up by name), so code running there can't use it.

# engine-shared: Postgres (later identity, blob storage, a scheduler), as its
# own project on the `shared` network. Optional: use your own services instead,
# or start it with
#   docker compose -f davy-jones-locker/engine-shared/compose.yaml up -d --wait
# and uncomment the `shared` lines below.

services:
  engine:
    build: ./engine
    env_file:
      - path: ./engine/.env
        required: false
    environment:
      RUNNER_URL: http://runner:3000
      NODE_WORKER_URL: http://node-worker:3000
      PUBLIC_HOST: engine
    ports:
      - "9001:3000"
    networks:
      - default
      - sandbox
      - nodes
      # - shared
    depends_on:
      - runner
    restart: unless-stopped

  # Runs PythonScript code. It holds no credentials and can reach nothing but
  # the engine; the container is read-only, unprivileged and capability-free,
  # with scratch space in memory. One run at a time per container: add
  # replicas for more.
  runner:
    build:
      context: ./engine
      dockerfile: runner/Dockerfile
    # Its own settings file, not .env: nothing with credentials may reach it
    # (a script could read the server process's environment).
    env_file:
      - path: ./engine/runner.env
        required: false
    environment:
      RUN_SCRATCH: /tmp
      RUN_SWEEP: "1"    # after each run, kill every process it left, even outside its group
    networks:
      - sandbox
    # An init as PID 1 reaps what scripts leave behind: otherwise their exited
    # processes pile up and use up pids_limit for every later run.
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped

  # Runs the app's own node kinds (its handlers are trusted code, but they
  # parse what users send). It holds no credentials and can reach nothing but
  # the engine; read-only, unprivileged and capability-free, like the runner.
  # Replace the build with the app's own image, FROM this one.
  node-worker:
    profiles: [nodes]
    build:
      context: ./engine
      dockerfile: nodeworker/Dockerfile
    # Its own settings file, not .env: nothing with credentials may reach it.
    env_file:
      - path: ./engine/node-worker.env
        required: false
    environment:
      NODE_SCRATCH: /tmp
      # NODE_KINDS: nodes:KINDS    # the app's list, in its image
    networks:
      - nodes
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 4g
    cpus: 2
    restart: unless-stopped

networks:
  sandbox:
    internal: true
  nodes:
    internal: true
  # shared:
  #   external: true
  #   name: ${SHARED_NETWORK:-shared}
