[project]
name = "davy-jones-locker"
version = "0.1.0"
description = "The Python engine that executes flowgraphs: SQL on a locked-down DuckDB, Python in a sandboxed runner, saved graphs, and an AI assistant. Its browser shell is davy-jones-locker on npm, on SEAMONSTER."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Luke Williams" }]
keywords = ["flowgraph", "data-pipeline", "duckdb", "fastapi", "sandbox"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
requires-python = ">=3.12"
# Ranges for anyone installing the package; the images install the pinned,
# hashed versions in requirements.txt (and runner/requirements.txt) instead.
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.53",
    "duckdb>=1.5",
    "pyarrow>=25",
    "psycopg[binary]>=3.3",
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/lukewilliams/davy-jones-locker/tree/main/davy-jones-locker/engine#readme"
Repository = "https://github.com/lukewilliams/davy-jones-locker"
Issues = "https://github.com/lukewilliams/davy-jones-locker/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["davy_jones_locker"]
