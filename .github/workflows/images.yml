# Builds DAVY JONES' LOCKER's base images and pushes them to GitHub's container
# registry, for each davy-jones-locker release:
#
#   ghcr.io/lukewilliams/davy-jones-locker-engine        the engine
#   ghcr.io/lukewilliams/davy-jones-locker-runner        the Python sandbox
#   ghcr.io/lukewilliams/davy-jones-locker-node-worker   runs an app's own node kinds
#
# each tagged with the version (0.2.0) and its minor (0.2), for linux/amd64 and
# linux/arm64. There's no `latest`: an app names the version it builds on.
#
# Runs when a davy-jones-locker-v<version> tag is pushed, or by hand (Actions,
# "Images", "Run workflow") for a version whose tag already exists. It builds
# from the tag, and refuses one that doesn't match the engine's version.
name: Images

on:
  push:
    tags:
      - 'davy-jones-locker-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, like 0.2.0 (its davy-jones-locker-v<version> tag must exist)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to ghcr.io
      id-token: write        # sign the provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: davy-jones-locker-engine
            dockerfile: davy-jones-locker/engine/Dockerfile
          - image: davy-jones-locker-runner
            dockerfile: davy-jones-locker/engine/runner/Dockerfile
          - image: davy-jones-locker-node-worker
            dockerfile: davy-jones-locker/engine/nodeworker/Dockerfile
    env:
      REGISTRY: ghcr.io
      CONTEXT: davy-jones-locker/engine
    steps:
      - name: Work out the version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: |
          version="${INPUT_VERSION:-${REF_NAME#davy-jones-locker-v}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' isn't a version like 0.2.0."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "tag=davy-jones-locker-v$version" >> "$GITHUB_OUTPUT"
          # Image names are lowercase, whatever the owner's name is.
          echo "name=$REGISTRY/${OWNER,,}/$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Check out the release's tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false

      - name: Check the tag matches the engine's version
        id: source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' "$CONTEXT/pyproject.toml")"
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::The tag says $VERSION, but pyproject.toml says $declared."
            exit 1
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for linux/arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Before anything is pushed: the image starts, and answers /health.
      - name: Build for this machine
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: smoke-test
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Check it answers /health
        run: |
          docker run -d --name smoke -p 3000:3000 smoke-test
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then echo; exit 0; fi
            sleep 1
          done
          echo "::error::The image didn't answer /health within 30 seconds."
          docker logs smoke
          exit 1

      - name: Sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for both architectures, and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.version.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.name }}:${{ steps.version.outputs.minor }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.image }}

      # Says which commit and workflow built the image; check it with
      #   gh attestation verify oci://<image>:<version> --owner <owner>
      # Skipped while the repository is private: attestations there need a
      # paid plan, and nobody outside could check them anyway.
      - name: Attest where the image came from
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.version.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
